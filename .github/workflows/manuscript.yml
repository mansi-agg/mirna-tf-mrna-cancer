# Renders manuscript.qmd to HTML and publishes it on GitHub Pages:
# https://mansi-agg.github.io/mirna-tf-mrna-cancer/
name: Publish manuscript

# Manual only for now (Pages needs the repo to be public). To publish on every
# push again, uncomment the `push` trigger below.
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - manuscript.qmd
  #     - plots/**
  #     - .github/workflows/manuscript.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render manuscript
        run: |
          quarto render manuscript.qmd
          mkdir _site
          mv manuscript.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
